<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GanyanSosyal – Yakında Google Play’de</title>
<meta name="description" content="GanyanSosyal çok yakında Google Play’de yayında.">
<meta name="theme-color" content="#06231b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310a06f'/><text x='50' y='70' font-size='62' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'>G</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf6f0; --bg2:#d3ece1; --card:#ffffff; --ink:#07261c; --muted:#4d6b5f;
  --green:#0e9a6a; --green2:#16c48a; --stub:#fff4d6; --line:#b9d8c9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#06231b; --bg2:#0a3a2b; --card:#0d3025; --ink:#eafaf3; --muted:#93b9a8; --green:#16c48a; --green2:#35e3a8; --stub:#123b2d; --line:#1f5a45; }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:radial-gradient(120% 80% at 80% -10%,var(--bg2),var(--bg) 60%);
  background-color:var(--bg);
  display:grid;place-items:center;padding:24px;
}
.ticket{
  width:min(440px,100%);
  background:var(--card);
  border-radius:28px;
  position:relative;
  box-shadow:0 30px 60px -25px rgba(4,40,28,.45);
  animation:drop .9s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes drop{from{opacity:0;transform:translateY(24px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.top{padding:34px 30px 30px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.logo{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(145deg,var(--green2),var(--green));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);
}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand b span{color:var(--green)}
h1{font-size:clamp(34px,10vw,46px);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin-bottom:16px}
p{color:var(--muted);font-size:16px;line-height:1.55;max-width:34ch}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 22px}
.perf::before,.perf::after{
  content:"";position:absolute;top:-17px;width:32px;height:32px;border-radius:50%;
  background:var(--bg);
}
.perf::before{left:-38px}
.perf::after{right:-38px}
.stub{
  background:var(--stub);border-radius:0 0 28px 28px;
  padding:26px 30px 30px;display:flex;align-items:center;gap:16px;
}
.play{
  display:flex;align-items:center;gap:12px;flex:1;
  background:var(--ink);color:var(--card);
  padding:12px 18px;border-radius:16px;
}
a.play{text-decoration:none;cursor:pointer}
.play svg{width:26px;height:26px;flex:none}
.play small{display:block;font-size:12px;opacity:.7;font-weight:500}
.play strong{font-size:18px;font-weight:800;letter-spacing:-.01em}
.soon{
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--green);
  white-space:nowrap;
}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green2);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,196,138,.6)}100%{box-shadow:0 0 0 12px rgba(22,196,138,0)}}
@media (max-width:420px){.stub{flex-direction:column;align-items:stretch}.soon{justify-content:center}}
@media (prefers-reduced-motion:reduce){.ticket,.dot{animation:none}}
</style>
</head>
<body>
<main class="ticket">
  <div class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">G</div>
      <b>Ganyan<span>Sosyal</span></b>
    </div>
    <h1>Yakında Google Play’de yayında</h1>
    <p>Tahminlerini paylaş, kuponunu takip et. GanyanSosyal çok yakında telefonunda.</p>
  </div>
  <div class="perf" aria-hidden="true"></div>
  <div class="stub">
    <a class="play" href="https://play.google.com/store/apps/details?id=io.github.ganyansosyal.app" target="_blank" rel="noopener" aria-label="Google Play’de aç">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.2v17.6c0 .6.7 1 1.2.7l14-8.8c.5-.3.5-1.1 0-1.4l-14-8.8C5.7 2.2 5 2.600 5 3.200z" fill="#35e3a8"/></svg>
      <div><small>Yayına hazırlanıyor</small><strong>Google Play</strong></div>
    </a>
    <div class="soon"><span class="dot"></span>Çok yakında</div>
  </div>
</main>
</body>
</html>
